name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck web
        run: npx tsc -p tsconfig.json --noEmit

      - name: Typecheck server
        run: npx tsc -p tsconfig.server.json --noEmit

      - name: Build web
        run: npm run build:web

      - name: Build server
        run: npm run build:api

      - name: Smoke test the API
        run: |
          PORT=4100 node dist-server/index.js &
          sleep 3
          curl --fail --silent http://127.0.0.1:4100/api/health
          curl --fail --silent http://127.0.0.1:4100/api/watches?limit=1 > /dev/null
          kill %1

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: unique-trendz:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
