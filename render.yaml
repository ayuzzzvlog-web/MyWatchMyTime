# One-click deploy to Render (https://render.com) — free tier friendly.
# Dashboard → New → Blueprint → point at this repository.
services:
  - type: web
    name: unique-trendz
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: catalogue-data
      mountPath: /var/data
      sizeGB: 1
